<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hasmop, İzmir merkezli mop üretimi yapan kurumsal bir işletmedir. Kaliteli, dayanıklı ve profesyonel mop çözümleri için bizimle iletişime geçin."
    />
    <meta
      name="keywords"
      content="İzmir mop üretimi, mop üreticisi, temizlik ekipmanları, endüstriyel mop, mikrofiber mop, toptan mop, kurumsal temizlik ürünleri, Hasmop"
    />
    <meta property="og:title" content="Hasmop | İzmir Mop Üretimi ve Temizlik Ekipmanları" />
    <meta
      property="og:description"
      content="İzmir merkezli Hasmop ile kaliteli, dayanıklı ve profesyonel mop üretimi çözümleri."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#082032" />
    <title>Hasmop | İzmir Mop Üretimi ve Temizlik Ekipmanları</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#082032;color:white;font-family:Arial,sans-serif;padding:24px;text-align:center">
        <div>
          <strong style="display:block;font-size:32px;margin-bottom:10px">Hasmop</strong>
          <span>Site yükleniyor...</span>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;background:#082032;color:white;font-family:Arial,sans-serif;padding:24px">' +
          '<div style="max-width:720px"><h1 style="margin:0 0 12px">Hasmop site yüklenemedi</h1>' +
          '<p style="line-height:1.6">Tarayıcı tarafında bir hata oluştu. Hata: ' +
          String(event.message || "Bilinmeyen hata") +
          "</p></div></div>";
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
